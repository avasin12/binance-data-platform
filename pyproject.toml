[project]
name = "binance-data-platform"
version = "0.1.0"
description = "End-to-end data engineering platform using Airflow, MinIO, PostgreSQL and ClickHouse"
requires-python = ">=3.12"
dependencies = [
    "apache-airflow-providers-amazon>=9.33.0",
    "astronomer-cosmos>=1.15.0",
    "boto3>=1.43.61",
    "clickhouse-connect>=1.6.0",
    "dbt-postgres>=1.11.0",
    "minio>=7.2.20",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.51",
]

[tool.ruff]

exclude = [
    ".git",
    ".venv",
    ".ruff_cache",
    "__pycache__",
    "logs",
]



line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

ignore = [
    "E501",
]


[tool.ruff.lint.isort]
known-first-party = ["acme"]


[tool.pytest.ini_options]
pythonpath = [
    "dags"
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]
